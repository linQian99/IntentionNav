# Synonym map for the 66 DDN benchmark target categories.
#
# Used by IM (Intent Match): a model's free-text predicted target is
# lowercased and snake-cased, then checked against keys + aliases below.
# Exact or alias match → IM=1. IM is independent of nav success (SR);
# IM measures pure intent comprehension by the LLM.
#
# Keys are the canonical target_category strings as they appear in
# selected_500_intents.jsonl. Aliases include plausible synonyms, hyponyms,
# and common misspellings. Case-insensitive; snake_case and plain-English
# both accepted by the matcher.

